name: CI
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Run complete suite offline (timeout is a failure)
        run: |
          timeout --kill-after=10s 180s python3 scripts/evaluation/run-offline.py \
            "$(command -v node)" node_modules/vitest/vitest.mjs run --maxWorkers=2 --minWorkers=1
      - name: Check production dependencies (findings are a failure)
        run: pnpm audit --prod --audit-level=moderate
